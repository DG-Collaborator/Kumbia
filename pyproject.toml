[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumbia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
core = ["httpx>=0.27"]
rag = ["httpx>=0.27"]
mcp = ["mcp", "python-dotenv"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]